[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artemis-api"
version = "0.1.0"
description = "A REPL chat client and library for the Kore.ai Agent Platform (Artemis) Agentic App API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "David Gwartney", email = "david.gwartney@gmail.com" },
]
maintainers = [
    { name = "David Gwartney", email = "david.gwartney@gmail.com" },
]
keywords = ["kore.ai", "artemis", "agent-platform", "repl", "chat", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dgwartney/artemis-api-python"
Repository = "https://github.com/dgwartney/artemis-api-python"
Issues = "https://github.com/dgwartney/artemis-api-python/issues"
Changelog = "https://github.com/dgwartney/artemis-api-python/blob/main/CHANGELOG.md"

[project.scripts]
artemis = "artemis_api.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/artemis_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src/artemis_api"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "if TYPE_CHECKING:",
]
